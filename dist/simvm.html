<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Simulador de Memoria Virtual 351</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <meta name="description" content="Simulador de memoria virtual con TLB, tabla de páginas, swap y políticas de reemplazo LRU, FIFO y aleatoria.">
  <style>
/* ==========================================================
   Variables de diseño — tema claro (mismo lenguaje visual que
   el Simulador de Memoria Caché 351 del grupo).
   Layout: encabezado degradado + filas de paneles blancos:
   configurar | operar | mensajes, luego estructuras y resultados.
========================================================== */
:root {
  color-scheme: light;

  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --primary-light: #dbeafe;

  --secondary: #64748b;
  --secondary-dark: #475569;

  --success: #16a34a;
  --success-dark: #15803d;
  --success-light: #dcfce7;

  --danger: #dc2626;
  --danger-dark: #b91c1c;
  --danger-light: #fee2e2;

  --warning: #f59e0b;
  --warning-dark: #b45309;
  --warning-light: #fef3c7;

  --info: #0891b2;
  --info-dark: #0e7490;
  --info-light: #cffafe;

  --purple: #7c3aed;
  --purple-light: #ede9fe;

  --background: #f1f5f9;
  --surface: #ffffff;
  --surface-secondary: #f8fafc;
  --ink-strong: #0f172a;
  --table-head: #1e293b;

  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-muted: #94a3b8;
  --on-dark: #ffffff;
  --on-dark-muted: #cbd5e1;

  --border: #e2e8f0;
  --border-dark: #cbd5e1;

  /* Campos de la dirección: el mismo color en toda la interfaz */
  --f-vpn: var(--warning-dark);
  --f-vpn-bg: var(--warning-light);
  --f-tag: var(--purple);
  --f-tag-bg: var(--purple-light);
  --f-idx: var(--primary-dark);
  --f-idx-bg: var(--primary-light);
  --f-off: var(--success-dark);
  --f-off-bg: var(--success-light);
  --f-ppn: var(--info-dark);
  --f-ppn-bg: var(--info-light);
  --f-swap: #a16207;
  --f-swap-bg: #fef9c3;

  /* Resaltado del paso actual */
  --hl: #fef08a;
  --hl-ring: #eab308;

  --shadow-sm: 0 2px 6px rgb(15 23 42 / 0.05);
  --shadow-md: 0 6px 18px rgb(15 23 42 / 0.09);
  --shadow-lg: 0 12px 35px rgb(15 23 42 / 0.16);

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 15px;

  --font-body: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: Consolas, "Cascadia Mono", "SFMono-Regular", Menlo, "Liberation Mono", monospace;

  --gap: 16px;
}

/* ==========================================================
   Base y distribución general
========================================================== */

*,
*::before,
*::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

[hidden] { display: none !important; }

body {
  margin: 0;
  min-height: 100%;
  background: var(--background);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.55;
}

h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }

::selection { background: #bfdbfe; color: #1e40af; }

:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

.mono, code { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--text-secondary); }

.visually-hidden {
  position: absolute !important;
  width: 1px; height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* ---------- encabezado ---------- */

.header {
  color: var(--on-dark);
  background: linear-gradient(120deg, #0f172a 0%, #1e3a8a 55%, #2563eb 100%);
  box-shadow: var(--shadow-md);
}

.header__inner {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px 24px;
  max-width: 1800px;
  margin: 0 auto;
  padding-block: 18px;
  padding-left: max(28px, env(safe-area-inset-left, 0px));
  padding-right: max(28px, env(safe-area-inset-right, 0px));
}

.header h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.01em; line-height: 1.2; }
.header__titles p { color: var(--on-dark-muted); font-size: 0.86rem; margin-top: 4px; }
.header__actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- filas de paneles ---------- */

.page {
  display: flex;
  flex-direction: column;
  gap: var(--gap);
  max-width: 1800px;
  margin: 0 auto;
  padding-block: var(--gap) 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.row {
  display: grid;
  gap: var(--gap);
  align-items: stretch;
}

.row--top { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); }
.row--three { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr) minmax(0, 1fr); align-items: start; }
.row--storage { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); align-items: start; }

@media (max-width: 1280px) {
  .row--top { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .panel--messages { grid-column: 1 / -1; }
  .row--three { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  #vm-view { grid-column: 1 / -1; }
}

@media (max-width: 860px) {
  .row--top,
  .row--three,
  .row--storage { grid-template-columns: minmax(0, 1fr); }
  .header__inner { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .header h1 { font-size: 1.35rem; }
}

.footer {
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
  text-align: center;
  font-size: 0.8rem;
  color: var(--on-dark-muted);
  background: var(--ink-strong);
}

/* ==========================================================
   Componentes reutilizables
========================================================== */

/* ---------- paneles y tarjetas ---------- */

.panel {
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}

.panel__head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 12px;
  padding: 14px 16px;
  background: var(--surface-secondary);
  border-bottom: 1px solid var(--border);
}

.panel__title { font-size: 1.12rem; font-weight: 700; color: var(--text-primary); }
.panel__meta { color: var(--text-secondary); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.panel__head > :last-child.btn,
.panel__head > .badge:last-child,
.panel__head > .check:last-child { margin-left: auto; }

.panel__body {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 14px 16px 16px;
  min-width: 0;
}

.card {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px 14px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  min-width: 0;
}

.card--soft { background: var(--surface-secondary); }
.card--summary { border: 1px solid #bfdbfe; border-left: 4px solid var(--primary); background: #f8fbff; }

.card__head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

.card__title { font-size: 0.92rem; font-weight: 700; }
.card--summary .card__title { color: var(--primary-dark); }
.card__note { color: var(--text-secondary); font-size: 0.8rem; }

.group-title {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--primary-dark);
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: 0.74rem;
  font-weight: 600;
  background: var(--primary-light);
  color: var(--primary-dark);
  white-space: nowrap;
}

.badge--neutral { background: var(--border); color: var(--text-secondary); }
.badge--ok { background: var(--success-light); color: var(--success-dark); }
.badge--warn { background: var(--warning-light); color: var(--warning-dark); }

.hint { color: var(--text-secondary); font-size: 0.8rem; }
.empty { color: var(--text-muted); font-style: italic; text-align: center; padding: 22px 8px; }

.callout {
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border-left: 4px solid var(--primary);
  background: #eff6ff;
  color: var(--text-secondary);
  font-size: 0.82rem;
}

.callout--ok { border-left-color: var(--success); background: #f0fdf4; }

/* ---------- campos ---------- */

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px 12px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.field__label { font-size: 0.78rem; font-weight: 600; color: var(--text-primary); }
.field__help { font-size: 0.72rem; color: var(--text-muted); }

.input,
.field select,
.field input,
.field textarea {
  width: 100%;
  min-height: 38px;
  padding: 7px 10px;
  border: 1px solid var(--border-dark);
  border-radius: var(--radius-sm);
  background: var(--surface);
  transition: border-color 0.2s, box-shadow 0.2s;
}

.field input.mono,
.field textarea { font-family: var(--font-mono); }
.field textarea { resize: vertical; min-height: 70px; }

.input:focus,
.field select:focus,
.field input:focus,
.field textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgb(37 99 235 / 0.15);
}

.field input:disabled,
.field select:disabled,
.field textarea:disabled { background: var(--surface-secondary); color: var(--text-muted); }

.input-action {
  display: flex;
  gap: 8px;
  align-items: flex-end;
}

.input-action .field { flex: 1 1 auto; }

/* ---------- interruptor (toggle) ---------- */

.toggle {
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
}

.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }

.toggle__track {
  position: relative;
  flex: 0 0 auto;
  width: 38px;
  height: 22px;
  border-radius: 999px;
  background: var(--border-dark);
  transition: background 0.2s;
}

.toggle__track::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  transition: transform 0.2s;
}

.toggle input:checked + .toggle__track { background: var(--primary); }
.toggle input:checked + .toggle__track::after { transform: translateX(16px); }
.toggle input:focus-visible + .toggle__track { outline: 2px solid var(--primary); outline-offset: 2px; }
.toggle input:disabled + .toggle__track { opacity: 0.5; }
.toggle__text { display: flex; flex-direction: column; font-weight: 600; font-size: 0.86rem; }
.toggle__text small { font-weight: 400; color: var(--text-secondary); font-size: 0.76rem; }

.check {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.8rem;
  font-weight: 500;
  cursor: pointer;
}

.check input { accent-color: var(--primary); width: 15px; height: 15px; }

/* ---------- botones ---------- */

.button-row { display: flex; flex-wrap: wrap; gap: 8px; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 38px;
  padding: 7px 16px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: var(--secondary);
  color: var(--on-dark);
  font-weight: 600;
  white-space: nowrap;
  transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
}

.btn:hover:not(:disabled) { background: var(--secondary-dark); box-shadow: var(--shadow-sm); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.5; }

.btn--primary { background: var(--primary); }
.btn--primary:hover:not(:disabled) { background: var(--primary-dark); }
.btn--success { background: var(--success); }
.btn--success:hover:not(:disabled) { background: var(--success-dark); }
.btn--warning { background: var(--warning); color: var(--ink-strong); }
.btn--warning:hover:not(:disabled) { background: #fbbf24; }
.btn--danger { background: var(--danger); }
.btn--danger:hover:not(:disabled) { background: var(--danger-dark); }
.btn--header { background: rgb(255 255 255 / 0.16); border-color: rgb(255 255 255 / 0.25); }
.btn--header:hover:not(:disabled) { background: rgb(255 255 255 / 0.26); }

.btn--outline {
  background: var(--surface);
  color: var(--primary-dark);
  border-color: #93c5fd;
}

.btn--outline:hover:not(:disabled) { background: var(--primary-light); }

.btn--light {
  background: var(--border);
  color: var(--text-secondary);
  min-height: 30px;
  padding: 4px 12px;
  font-size: 0.8rem;
}

.btn--light:hover:not(:disabled) { background: var(--border-dark); }
.btn--block { width: 100%; }
.btn--lg { min-height: 44px; font-size: 0.95rem; }
.btn--tiny { min-height: 24px; padding: 1px 9px; font-size: 0.74rem; background: var(--primary); }

.link {
  border: 0;
  background: none;
  padding: 0;
  font-family: var(--font-mono);
  font-weight: 600;
  color: var(--f-vpn);
  text-decoration: underline dotted;
  text-underline-offset: 3px;
}

/* ---------- tablas ---------- */

.table-wrap {
  overflow: auto;
  max-width: 100%;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
}

.table-wrap--tall { max-height: 420px; }

.grid-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 0.8rem;
  font-variant-numeric: tabular-nums;
}

.grid-table th,
.grid-table td {
  padding: 6px 9px;
  border-bottom: 1px solid var(--border);
  text-align: center;
  white-space: nowrap;
}

.grid-table thead th {
  position: sticky;
  top: 0;
  z-index: 1;
  background: var(--table-head);
  color: var(--on-dark);
  font-size: 0.74rem;
  font-weight: 600;
  border-bottom: 0;
}

.grid-table tbody th { font-weight: 600; }
.grid-table tbody tr:nth-child(even) > * { background: var(--surface-secondary); }
.grid-table tbody tr:last-child > * { border-bottom: 0; }

.grid-table tr.is-empty td,
.grid-table tr.is-empty th { color: var(--text-muted); }

.grid-table tr.is-soft > * { background: #fefce8; }
.grid-table tbody tr.is-selected > * { background: var(--primary-light); }
.grid-table tbody tr.is-focus > *,
.grid-table td.is-focus {
  background: var(--hl);
  color: var(--text-primary);
}

.grid-table tr.is-focus > :first-child { box-shadow: inset 4px 0 0 var(--hl-ring); }

.bit { font-family: var(--font-mono); }
.bit--on { font-weight: 700; color: var(--text-primary); }
.bit--off { color: var(--text-muted); }

.bit-toggle {
  min-width: 26px;
  min-height: 22px;
  border-radius: 4px;
  border: 1px solid var(--border-dark);
  background: var(--surface);
  color: var(--text-muted);
  font-family: var(--font-mono);
}

.bit-toggle.is-on {
  background: var(--success-light);
  border-color: var(--success);
  color: var(--success-dark);
  font-weight: 700;
}

.bit-toggle:hover:not(:disabled) { border-color: var(--primary); }

.field-tag { color: var(--f-tag); font-weight: 600; }
.field-ppn { color: var(--f-ppn); font-weight: 600; }
.field-swap { color: var(--f-swap); font-weight: 600; }
.set-label { color: var(--f-idx); font-family: var(--font-mono); }
.grid-table tr.set-start > * { border-top: 2px solid var(--border-dark); }
.grid-table tbody tr.set-start:first-child > * { border-top: 0; }

/* ---------- pestañas ---------- */

.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 0 16px;
  background: var(--surface-secondary);
  border-bottom: 1px solid var(--border);
}

.tab {
  border: 0;
  background: none;
  padding: 13px 14px 11px;
  border-bottom: 3px solid transparent;
  font-weight: 700;
  font-size: 0.95rem;
  color: var(--text-secondary);
}

.tab[aria-selected="true"] { color: var(--primary-dark); border-bottom-color: var(--primary); }
.tab .badge { margin-left: 6px; }

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 16px;
}

/* ---------- aviso flotante ---------- */

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  z-index: 30;
  max-width: min(560px, calc(100vw - 32px));
  padding: 11px 18px;
  border-radius: var(--radius-md);
  background: var(--ink-strong);
  color: var(--on-dark);
  box-shadow: var(--shadow-lg);
  font-weight: 600;
}

.toast[data-tone="bad"] { background: var(--danger); }
.toast[data-tone="ok"] { background: var(--success-dark); }

/* ---------- diálogo de ayuda ---------- */

.help {
  width: min(760px, calc(100vw - 32px));
  max-height: calc(100vh - 48px);
  padding: 0;
  border: 0;
  border-radius: var(--radius-lg);
  background: var(--surface);
  color: var(--text-primary);
  box-shadow: var(--shadow-lg);
}

.help::backdrop { background: rgb(15 23 42 / 0.55); }
.help__body { display: flex; flex-direction: column; gap: 12px; padding: 16px 20px 20px; overflow: auto; }
.help__body h3 { font-size: 0.95rem; color: var(--primary-dark); }
.help__body ol, .help__body ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.help__body li { max-width: 72ch; }

/* ==========================================================
   Estilos propios de cada vista
========================================================== */

/* ---------- resumen del sistema ---------- */

.summary-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

.summary-tile {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  padding: 8px 6px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  text-align: center;
  min-width: 0;
}

.summary-tile__label { font-size: 0.72rem; color: var(--text-secondary); }
.summary-tile__value { font-family: var(--font-mono); font-size: 1.05rem; font-weight: 700; color: var(--primary-dark); }
.summary-tile__formula { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text-muted); }

/* ---------- asignación ---------- */

.alloc-summary {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

.alloc-summary__item {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 6px 4px;
  border-radius: var(--radius-sm);
  background: var(--surface-secondary);
  border: 1px solid var(--border);
  font-size: 0.74rem;
  color: var(--text-secondary);
}

.alloc-summary__value { font-family: var(--font-mono); font-size: 1rem; font-weight: 700; color: var(--text-primary); }
.alloc-summary__item.is-mm { background: var(--f-ppn-bg); border-color: #a5f3fc; }
.alloc-summary__item.is-swap { background: var(--f-swap-bg); border-color: #fde68a; }

.alloc-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; }
.alloc-row .field { width: 6.5em; flex: 0 0 auto; }
.alloc-row .btn { flex: 1 1 auto; }

/* ---------- descomposición de la dirección ---------- */

.binary {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 12px 10px;
  border-radius: var(--radius-md);
  background: var(--ink-strong);
  color: var(--on-dark-muted);
  text-align: center;
}

.binary__caption { font-size: 0.74rem; }
.binary__bits { max-width: 100%; overflow-x: auto; padding-bottom: 2px; }

.bitrow {
  display: grid;
  grid-template-columns: repeat(var(--cols), minmax(18px, 1fr));
  gap: 2px 3px;
  min-width: calc(var(--cols) * 21px);
}

.bitbox {
  font-family: var(--font-mono);
  font-size: 1.15rem;
  font-weight: 700;
  line-height: 1.6;
}

.bitbox--tag { color: #c4b5fd; }
.bitbox--idx { color: #93c5fd; }
.bitbox--off { color: #86efac; }
.bitbox--ppn { color: #67e8f9; }

.bitlabel {
  padding-top: 2px;
  border-top: 2px solid currentColor;
  font-family: var(--font-mono);
  font-size: 0.66rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.bitlabel--vpn { color: #fcd34d; }
.bitlabel--tag { color: #c4b5fd; }
.bitlabel--idx { color: #93c5fd; }
.bitlabel--off { color: #86efac; }

 * Políticas de reemplazo (patrón Strategy).
 * Cada política recibe candidatos { id, loadedAt, lastUsed } y devuelve la víctima.

 * Agregar una política nueva solo requiere registrarla en POLICIES.

function minBy(items, key) {
  return items.reduce((best, item) => (key(item) < key(best) ? item : best));
}

const LRU = Object.freeze({
  id: 'LRU',
  label: 'LRU (menos reciente)',
  selectVictim: (candidates) => minBy(candidates, (c) => c.lastUsed),
});

const FIFO = Object.freeze({
  id: 'FIFO',
  label: 'FIFO (primera en entrar)',
  selectVictim: (candidates) => minBy(candidates, (c) => c.loadedAt),
});

  label: 'Aleatoria (Random)',
  selectVictim: (candidates, rng) => rng.pick(candidates),
});

/**
 * Generador pseudoaleatorio con semilla (mulberry32).
 * Con la misma semilla se obtiene la misma secuencia, lo que permite repetir
 * un experimento y comparar políticas sobre exactamente el mismo estado.
 */
class SeededRandom {
  constructor(seed = 351) {
    this.state = seed >>> 0;
  }

  next() {
    this.state = (this.state + 0x6d2b79f5) >>> 0;
    let t = this.state;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  int(maxExclusive) {
    return Math.floor(this.next() * maxExclusive);
  }

  pick(items) {
    return items[this.int(items.length)];
  }

  /** Devuelve una copia barajada (Fisher–Yates). */
  shuffle(items) {
    const copy = [...items];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = this.int(i + 1);
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }
}

return { SeededRandom };

/** Pequeñas utilidades de DOM compartidas por las vistas. */

/**
 * Crea un elemento: h('button', { class: 'btn', onclick: fn }, 'Texto').
 * Props especiales: class, dataset, text, on<evento>. Valores true crean
 * atributos booleanos; null/false se omiten.
 */
function h(tag, props = {}, ...children) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(props ?? {})) {
    if (value === null || value === undefined || value === false) continue;
    if (key === 'class') el.className = value;

    else if (key === 'text') el.textContent = value;
    else if (key.startsWith('on') && typeof value === 'function') el.addEventListener(key.slice(2), value);
    else if (value === true) el.setAttribute(key, '');
    else el.setAttribute(key, String(value));
  }
  for (const child of children.flat(Infinity)) {
    if (child === null || child === undefined || child === false) continue;
    el.append(child instanceof Node ? child : String(child));
  }
  return el;
}

/** Une nombres de clase descartando los vacíos. */
function cx(...names) {
  return names.filter(Boolean).join(' ');
}

function panelHead(title, meta, ...actions) {
  return h('header', { class: 'panel__head' },
    h('h2', { class: 'panel__title' }, title),
    meta ? (meta instanceof Node ? meta : h('p', { class: 'panel__meta' }, meta)) : null,
    actions);
}

function card({ title, note, extra, className = '' }, ...children) {
  return h('section', { class: cx('card', className) },
    h('header', { class: 'card__head' }, h('h3', { class: 'card__title' }, title), extra ?? null),
    note ? h('p', { class: 'card__note' }, note) : null,
    children);
}

function field(control, label, help) {

    h('span', { class: 'field__label' }, label),

    help ? h('span', { class: 'field__help' }, help) : null);
}

function toggle(input, title, subtitle) {

    ['TLB', (e) => (e.tlb === 'hit' ? 'Acierto' : 'Fallo')],
    ['Tabla', (e) => PT_LABELS[e.pt] ?? '—'],
    ['PPN/SSN', (e) => locationText(fx, e)],
    ['Reemplazo', (e) => (e.replaced ? `VPN ${fx.vpn(e.replaced.vpn)} → SSN ${fx.ssn(e.replaced.ssn)}` : '—')],
    ['Seg. fault', (e) => (e.outcome === 'segfault' ? 'SÍ' : 'NO')],
    ['Resultado', (e) => outcomeText(fx, e)],
  ];
}

function toTsv(header, rows) {
  return [header, ...rows].map((r) => r.join('\t')).join('\n');
}

/* ---------- Historial ---------- */

class HistoryTab {
  constructor({ session, guard, toast }) {
    this.session = session;
    this.guard = guard;
    this.toast = toast;
    this.element = h('div', { class: 'tab-panel panel__body' });
  }

  mount() {
    this.table = h('div', { class: 'table-wrap table-wrap--tall' });
    this.element.replaceChildren(
      h('div', { class: 'toolbar' },
        h('p', { class: 'muted' }, 'Cada acceso queda registrado con las columnas de las tablas de la práctica.'),
        h('div', { class: 'button-row' },
          h('button', { class: 'btn btn--light', type: 'button', onclick: () => this.#copy() }, '📥 Copiar tabla'),
          h('button', { class: 'btn btn--light', type: 'button', onclick: this.guard(() => this.session.clearHistory()) }, 'Limpiar'))),
      this.table);
  }

  render() {
    const s = this.session;
    if (s.history.length === 0) {
      this.table.replaceChildren(h('p', { class: 'empty' }, 'No hay operaciones registradas.'));
      return;
    }
    const cols = historyColumns(s.format);
    const rows = [...s.history].reverse().map((e) => h('tr', { class: cx(e.outcome !== 'ok' && 'is-fault') },
      cols.map(([, get], i) => h(i === 0 ? 'th' : 'td', { class: i > 1 ? 'mono' : '' }, String(get(e))))));
    this.table.replaceChildren(h('table', { class: 'grid-table history-table' },
      h('thead', {}, h('tr', {}, cols.map(([name]) => h('th', { scope: 'col' }, name)))),
      h('tbody', {}, rows)));
  }

  async #copy() {
    const s = this.session;
    const cols = historyColumns(s.format);
    const tsv = toTsv(cols.map(([n]) => n), s.history.map((e) => cols.map(([, get]) => get(e))));
    const ok = await copyText(tsv);
    this.toast.show(ok ? 'Tabla copiada. Pégala en Excel, Sheets o Word.' : 'No se pudo copiar automáticamente.', ok ? 'ok' : 'bad');
  }
}

/* ---------- Comparación de políticas ---------- */

class CompareTab {
  constructor({ session, toast }) {
    this.session = session;
    this.toast = toast;
    this.element = h('div', { class: 'tab-panel panel__body' });
  }

  mount() {}

  render() {
    const cmp = this.session.comparison;
    if (!cmp) {
      this.element.replaceChildren(h('p', { class: 'empty' },
        'Sin comparación todavía. En "Secuencia de accesos" pulsa "Comparar políticas". Para la tabla 5.4 asigna antes todas las páginas.'));
      return;
    }
    const fx = this.session.format;
    const { data } = cmp;
    const best = Math.min(...data.runs.map((r) => r.totals.replacements));

    const table = h('table', { class: 'grid-table compare-table' },
      h('thead', {},
        h('tr', {},
          h('th', { scope: 'col', rowspan: 2 }, 'Dirección virtual (dec)'),
          h('th', { scope: 'col', rowspan: 2 }, 'VPN'),
          data.runs.map((r) => h('th', { scope: 'colgroup', colspan: 2, class: 'group-head' }, r.policy))),
        h('tr', {}, data.runs.map(() => [h('th', { scope: 'col' }, 'PPN/SSN'), h('th', { scope: 'col' }, '# Reempl.')]))),
      h('tbody', {}, data.addresses.map((va, i) => h('tr', {},
        h('th', { scope: 'row', class: 'mono' }, String(va)),
        h('td', { class: 'mono' }, fx.vpn(data.runs[0].rows[i].vpn)),
        data.runs.map((r) => {
          const row = r.rows[i];
          return [
            h('td', { class: cx('mono', row.result.outcome === 'segfault' && 'is-bad') }, this.#cellText(row)),
            h('td', { class: cx('mono num', row.replaced && 'is-warn') }, String(row.replaced)),
          ];
        })))),
      h('tfoot', {}, h('tr', {},
        h('th', { scope: 'row', colspan: 2 }, 'TOTAL'),
        data.runs.map((r) => [
          h('td', {}, `${r.totals.pageFaults} fallos de página · ${r.totals.tlbHits} aciertos TLB`),
          h('td', { class: cx('mono num total', r.totals.replacements === best && 'is-best') }, String(r.totals.replacements)),
        ]))));

    this.element.replaceChildren(
      h('div', { class: 'toolbar' },
        h('p', { class: 'muted' }, `${data.addresses.length} lecturas desde el mismo estado inicial · en verde, la política con menos reemplazos`),
        h('button', { class: 'btn btn--light', type: 'button', onclick: () => this.#copy() }, 'Copiar tabla')),
      h('div', { class: 'table-wrap' }, table));
  }

  #cellText(row) {
    const fx = this.session.format;
    const r = row.result;
    if (r.outcome === 'segfault') return 'No asignada';
    const before = row.location.kind === 'swap' ? `SSN ${fx.ssn(row.location.ssn)} → ` : '';
    return `${before}PPN ${fx.ppn(r.ppn)}`;
  }

  async #copy() {
    const fx = this.session.format;
    const { data } = this.session.comparison;
    const header = ['VA (dec)', 'VPN', ...data.runs.flatMap((r) => [`PPN/SSN ${r.policy}`, `# Reempl. ${r.policy}`])];
    const rows = data.addresses.map((va, i) => [va, fx.vpn(data.runs[0].rows[i].vpn),
      ...data.runs.flatMap((r) => [this.#cellText(r.rows[i]), r.rows[i].replaced])]);
    rows.push(['TOTAL', '', ...data.runs.flatMap((r) => ['', r.totals.replacements])]);
    const ok = await copyText(toTsv(header, rows));
    this.toast.show(ok ? 'Tabla copiada. Pégala en Excel, Sheets o Word.' : 'No se pudo copiar automáticamente.', ok ? 'ok' : 'bad');
  }
}

/* ---------- Contenedor con pestañas ---------- */

class ToolsPanel {
  constructor(root, ctx) {
    this.root = root;
    this.session = ctx.session;
    this.tabs = [
      { id: 'history', label: 'Historial de operaciones', view: new HistoryTab(ctx), count: () => this.session.history.length },
      { id: 'compare', label: 'Comparación de políticas de reemplazo', view: new CompareTab(ctx), count: () => this.session.comparison?.data.runs.length ?? 0 },
    ];
    this.active = 'history';
    this.lastComparison = null;
  }

  mount() {
    this.badges = this.tabs.map(() => h('span', { class: 'badge badge--neutral' }));
    this.buttons = this.tabs.map((t, i) => h('button', {
      class: 'tab', type: 'button', role: 'tab', id: `tab-${t.id}`, 'aria-controls': `tabpanel-${t.id}`,
      onclick: () => { this.active = t.id; this.render(); },
    }, t.label, this.badges[i]));
    this.tabs.forEach((t) => {
      t.view.mount();
      t.view.element.id = `tabpanel-${t.id}`;
      t.view.element.setAttribute('role', 'tabpanel');
      t.view.element.setAttribute('aria-labelledby', `tab-${t.id}`);
    });
    this.root.replaceChildren(
      h('div', { class: 'tabs', role: 'tablist' }, this.buttons),
      ...this.tabs.map((t) => t.view.element));
  }

  render() {
    const cmp = this.session.comparison;
    if (cmp && cmp.id !== this.lastComparison) this.active = 'compare';
    this.lastComparison = cmp?.id ?? null;
    this.tabs.forEach((t, i) => {
      const on = t.id === this.active;
      this.buttons[i].setAttribute('aria-selected', String(on));
      this.badges[i].textContent = String(t.count());
      t.view.element.hidden = !on;
      t.view.render();
    });
  }
}

return { ToolsPanel };
});
